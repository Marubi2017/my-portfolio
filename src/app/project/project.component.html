<app-header />

<section class="experience-section">
    <h1>Experience</h1>

    <article class="experience-card" *ngFor="let experience of experiences">
        <h2>{{ experience.role }}</h2>
        <p class="meta">
            <img src="location.png" alt="Location icon" />
            <span>{{ experience.company }} - {{ experience.location }}</span>
        </p>
        <p class="period">
            <img src="calendar.png" alt="Calendar icon" />
            <span>{{ experience.period }}</span>
        </p>

        <ul>
            <li *ngFor="let highlight of experience.highlights">{{ highlight }}</li>
        </ul>
    </article>
</section>
