<app-header />

<main>
    <h1 id="contact-heading">Let's Connect</h1>
    <div class="contact-layout">
        <div class="contact-form-section">
            <p>Open to collaborating on projects and discussing interesting engineering topics. Feel free to reach out
                to me.</p>
            @if (!submitted) {
            <form #contactForm="ngForm" (ngSubmit)="handleSubmit(contactForm)">
                <input type="text" placeholder="Name" name="name" [(ngModel)]="form.name" [disabled]="isSubmitting"
                    required />
                <input type="email" placeholder="Email" name="email" [(ngModel)]="form.email" [disabled]="isSubmitting"
                    required />
                <textarea placeholder="Message" name="message" [(ngModel)]="form.message" [disabled]="isSubmitting"
                    required></textarea>
                @if (error) {
                <p class="form-message form-message--error"> {{ error }} </p>
                }
                <button type="submit" [disabled]="isSubmitting"> {{ isSubmitting ? 'Sending...' : 'Send' }} </button>
            </form>
            }
            @if (submitted) {
            <div class="form-message form-message--success">
                <p> Thanks for the message. I'll reach out to you soon!</p>
            </div>
            }
        </div>

        <div class="contact-social-section">
            <h2 id="social-heading">Socials</h2>
            <div class="social-buttons">
                <a class="social-button" href="https://github.com/Marubi2017" target="_blank" rel="noopener noreferrer">
                    <img src="/github.png" alt="" width="24" height="24" />
                    <span>GitHub</span>
                </a>
                <a class="social-button" href="https://www.linkedin.com/in/michelle-arubi-64a17bb1" target="_blank"
                    rel="noopener noreferrer">
                    <img src="/linkedin.png" alt="" width="24" height="24" />
                    <span>LinkedIn</span>
                </a>
            </div>
        </div>
    </div>
</main>
